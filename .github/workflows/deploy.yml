name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:

jobs:
  build:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
      WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Find merged PR
        id: pr
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          data=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls \
            --jq '[.[] | select(.merged_at != null)] | .[0] | {number: .number, title: .title}' \
            2>/dev/null || echo 'null')
          echo "data=$data" >> "$GITHUB_OUTPUT"

      - name: Comment starting deploy on PR
        if: steps.pr.outputs.data != 'null' && steps.pr.outputs.data != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number=$(echo '${{ steps.pr.outputs.data }}' | jq -r '.number // empty')
          [ -n "$pr_number" ] && gh pr comment "$pr_number" \
            --repo ${{ github.repository }} \
            --body $'🚀 Starting production deploy of site header and footer fragments...'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
      - run: composer i
      - run: composer prod

      - name: Extract source strings
        run: composer extract-strings

      - name: Create pull request with source string updates
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          commit-message: |
            chore(i18n): refresh source strings

            Signed-off-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          title: "chore(i18n): refresh source strings"
          body: |
            Automated update of source strings for Weblate synchronization.

            - Ran `composer extract-strings`
            - Updated source catalog used by Weblate
          branch: chore/i18n-refresh-source-strings
          delete-branch: true
          add-paths: |
            lang/en/main.json

      - name: Store deployment info
        if: success()
        run: |
          pr_number=$(echo '${{ steps.pr.outputs.data }}' | jq -r '.number // empty')
          pr_title=$(echo '${{ steps.pr.outputs.data }}' | jq -r '.title // ""')
          jq -n \
            --arg sha    "${{ github.sha }}" \
            --arg repo   "${{ github.repository }}" \
            --arg ts     "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg title  "$pr_title" \
            --argjson num "${pr_number:-null}" \
            '{commit_sha: $sha, pr_number: $num, pr_title: $title, repository: $repo, timestamp: $ts}' \
            > build_production/_deployment-info.json

      - uses: crazy-max/ghaction-github-pages@v4
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          build_dir: build_production
          fqdn: libresign.coop
          jekyll: false
