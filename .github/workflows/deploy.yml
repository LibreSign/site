name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:

jobs:
  build:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Find merged PR
        id: pr
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          data=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls \
            --jq '[.[] | select(.merged_at != null)] | .[0] | {number: .number, title: .title}' \
            2>/dev/null || echo 'null')
          echo "data=$data" >> "$GITHUB_OUTPUT"

      - name: Comment starting deploy on PR
        if: steps.pr.outputs.data != 'null' && steps.pr.outputs.data != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_DATA: ${{ steps.pr.outputs.data }}
        run: |
          pr_number=$(jq -r '.number // empty' <<< "$PR_DATA")
          [ -n "$pr_number" ] && gh pr comment "$pr_number" \
            --repo ${{ github.repository }} \
            --body $'🚀 Starting production deploy of site header and footer fragments...'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: 8.3
      - run: composer i
      - run: composer prod
        env:
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}

      - name: Extract source strings
        run: composer extract-strings

      - name: Validate extracted source catalog
        run: composer validate-translations -- --canonical-source

      - name: Create pull request with source string updates
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          base: main
          commit-message: |
            chore(i18n): refresh source strings

            Signed-off-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          title: "chore(i18n): refresh source strings"
          body: |
            Automated update of source strings for Weblate synchronization.

            - Ran `composer extract-strings`
            - Updated source catalog used by Weblate
          branch: chore/i18n-refresh-source-strings
          delete-branch: true
          add-paths: |
            lang/en/main.json

      - name: Store deployment info
        if: success()
        env:
          PR_DATA: ${{ steps.pr.outputs.data }}
        run: |
          pr_number=$(jq -r '.number // empty' <<< "${PR_DATA:-null}")
          pr_title=$(jq -r '.title // ""' <<< "${PR_DATA:-null}")
          jq -n \
            --arg sha    "${{ github.sha }}" \
            --arg repo   "${{ github.repository }}" \
            --arg ts     "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg title  "$pr_title" \
            --argjson num "${pr_number:-null}" \
            '{commit_sha: $sha, pr_number: $num, pr_title: $title, repository: $repo, timestamp: $ts}' \
            > build_production/_deployment-info.json

      - uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          build_dir: build_production
          fqdn: libresign.coop
          jekyll: false
