name: PR Preview Fork Deploy

on:
  workflow_run:
    workflows: ["PR Preview"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].head.repo.id != github.event.workflow_run.repository.id
    runs-on: ubuntu-latest

    steps:
      - name: Check out trusted preview verification script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download preview artifact
        uses: actions/download-artifact@v4
        with:
          name: preview-build-fork
          path: build_production/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy preview
        uses: LibreSign/pr-preview-action@2a6da1177b47dc23173ba9a75e01da0a0d800978
        with:
          action: deploy
          source-dir: ./build_production/
          pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          pages-base-url: libresign.github.io/site-preview
          deploy-repository: LibreSign/site-preview
          preview-branch: gh-pages
          # The shared Pages branch can be published by another PR concurrently.
          wait-for-pages-deployment: false
          token: ${{ secrets.PREVIEW_TOKEN }}

      - name: Verify published preview revision
        env:
          PREVIEW_URL: https://libresign.github.io/site-preview/pr-preview/pr-${{ github.event.workflow_run.pull_requests[0].number }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash .github/scripts/verify-preview-publication.sh "$PREVIEW_URL" "$EXPECTED_SHA" build_production/preview-revision.txt
