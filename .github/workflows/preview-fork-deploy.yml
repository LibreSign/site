name: PR Preview Fork Deploy

on:
  workflow_run:
    workflows: ["PR Preview"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.id != github.event.repository.id
    runs-on: ubuntu-latest

    steps:
      # The deploy action invokes git config in the workspace. In this
      # privileged workflow_run, never check out untrusted fork code.
      - name: Checkout trusted base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # workflow_run.pull_requests may be empty for fork PRs. Verify the
      # source repository and exact HEAD before publishing untrusted HTML.
      - name: Resolve PR number from completed fork build
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          ref="${SOURCE_REPOSITORY%%/*}:$SOURCE_BRANCH"
          gh pr view "$ref" -R "$GITHUB_REPOSITORY" \
            --json number,state,baseRefName,headRefOid,headRepository |
            jq -er --arg sha "$SOURCE_SHA" --arg repo "$SOURCE_REPOSITORY" \
              'select(.state == "OPEN" and .baseRefName == "main" and
                      .headRefOid == $sha and .headRepository.nameWithOwner == $repo) |
               "number=\(.number)"' >> "$GITHUB_OUTPUT"

      - name: Download preview artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preview-build-fork
          path: build_production/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check downloaded preview
        run: test -s build_production/index.html

      - name: Deploy preview
        uses: LibreSign/pr-preview-action@2a6da1177b47dc23173ba9a75e01da0a0d800978
        with:
          action: deploy
          source-dir: ./build_production/
          pr-number: ${{ steps.pr.outputs.number }}
          pages-base-url: libresign.github.io/site-preview
          deploy-repository: LibreSign/site-preview
          preview-branch: gh-pages
          # The shared Pages branch can be published by another PR concurrently.
          wait-for-pages-deployment: false
          token: ${{ secrets.PREVIEW_TOKEN }}
