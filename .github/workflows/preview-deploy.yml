name: Preview Deploy

on:
  workflow_run:
    workflows: ["Preview Build"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: site-preview-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Extract PR number from workflow_run payload
        id: pr
        run: |
          pr_number=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Download preview build artifact
        if: steps.pr.outputs.number != ''
        uses: actions/download-artifact@v4
        with:
          name: preview-build
          path: build_production/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy preview
        id: preview
        if: steps.pr.outputs.number != ''
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          action: deploy
          source-dir: ./build_production/
          pr-number: ${{ steps.pr.outputs.number }}
          pages-base-url: libresign.github.io/site-preview
          deploy-repository: LibreSign/site-preview
          preview-branch: main
          wait-for-pages-deployment: true
          comment: false
          token: ${{ secrets.PREVIEW_TOKEN }}

      - name: Comment preview URL on the PR
        if: steps.pr.outputs.number != '' && steps.preview.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2.9.2
        with:
          header: pr-preview
          number: ${{ steps.pr.outputs.number }}
          message: |
            🚀 Preview: ${{ steps.preview.outputs.preview-url }}

            Built with PR Preview Action ${{ steps.preview.outputs.action-version }} at ${{ steps.preview.outputs.action-start-time }}.