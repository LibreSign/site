name: PR Preview

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Install PHP dependencies
        run: composer install

      - name: Adjust preview URLs
        run: |
          sed -i "s|libresign.coop|libresign.github.io|g" CNAME
          sed -i "s|baseUrl' => '/'|baseUrl' => 'https://LibreSign.github.io/site-preview/pr-preview/pr-${{ github.event.pull_request.number }}/'|g" config.php
          sed -i "s|base: '/assets/build/'|base: 'https://libresign.github.io/site-preview/pr-preview/pr-${{ github.event.pull_request.number }}/assets/build/'|g" vite.config.js
          sed -i "/'matomo_container'/d" config.production.php

      - name: Build production site
        env:
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
        run: composer prod

      - name: Stamp build with its PR head revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: printf '%s\n' "$EXPECTED_SHA" > build_production/preview-revision.txt

      - name: Upload fork preview artifact
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v4
        with:
          name: preview-build-fork
          path: build_production/
          retention-days: 1

      - name: Deploy preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: LibreSign/pr-preview-action@2a6da1177b47dc23173ba9a75e01da0a0d800978
        with:
          action: deploy
          source-dir: ./build_production/
          pr-number: ${{ github.event.pull_request.number }}
          pages-base-url: libresign.github.io/site-preview
          deploy-repository: LibreSign/site-preview
          preview-branch: gh-pages
          # Pages builds can be superseded when another PR publishes to site-preview.
          # Verify the live revision below, not the individual Pages run.
          wait-for-pages-deployment: false
          token: ${{ secrets.PREVIEW_TOKEN }}

      - name: Verify published preview revision
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          PREVIEW_URL: https://libresign.github.io/site-preview/pr-preview/pr-${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/verify-preview-publication.sh "$PREVIEW_URL" "$EXPECTED_SHA" build_production/preview-revision.txt
