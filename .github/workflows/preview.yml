name: PR Preview

on:
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: site-preview-deploy
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Skip preview for external forks
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "External fork PR detected. Preview deploy is skipped to keep repository secrets protected."
          {
            echo "## Preview skipped for external fork"
            echo ""
            echo "This workflow runs in pull_request context, where repository secrets are not exposed to forked PRs."
            echo "Complete preview deployment requires protected repository secrets and is only run for branches in LibreSign/site."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'

      - name: Setup Node
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up php 8.3
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Set up PHP dependencie
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
        run: composer i

      - name: Change config.php
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
        run: |
          sed -i "s|libresign.coop|libresign.github.io|g" CNAME
          sed -i "s|baseUrl' => '/'|baseUrl' => 'https://LibreSign.github.io/site-preview/pr-preview/pr-${{ github.event.pull_request.number }}/'|g" config.php
          sed -i "s|base: '/assets/build/'|base: 'https://libresign.github.io/site-preview/pr-preview/pr-${{ github.event.pull_request.number }}/assets/build/'|g" vite.config.js
          cat config.php|grep "'baseUrl' => "
          sed -i "/'matomo_container'/d" config.production.php

      - name: Run composer command
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
        env:
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
        run: composer prod

      - name: Deploy or remove preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          action: ${{ github.event.action == 'closed' && 'remove' || 'deploy' }}
          source-dir: ./build_production/
          pr-number: ${{ github.event.pull_request.number }}
          pages-base-url: libresign.github.io/site-preview
          deploy-repository: LibreSign/site-preview
          preview-branch: main
          wait-for-pages-deployment: true
          token: ${{ secrets.PREVIEW_TOKEN }}
